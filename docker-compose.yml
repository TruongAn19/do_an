services:
  # ================================================================
  # NEW stack (sân pickleball) 
  # ================================================================
  pickleball-mysql:
    image: mysql:8.0
    container_name: pickleball-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pickleball
    ports:
      - "3309:3306"
    volumes:
      - pickleball_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  pickleball-redis:
    image: redis:alpine
    container_name: pickleball-redis
    ports:
      - "6381:6379"

  pickleball-backend:
    build: .
    container_name: pickleball-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://pickleball-mysql:3306/pickleball?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_REDIS_HOST=pickleball-redis
      - SPRING_REDIS_PORT=6379
      - AI_CHAT_ENABLED=${AI_CHAT_ENABLED:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-disabled-placeholder-key}
      - PAYMENT_VNPAY_URL=${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      - PAYMENT_VNPAY_TMNCODE=${VNPAY_TMN_CODE}
      - PAYMENT_VNPAY_SECRETKEY=${VNPAY_HASH_SECRET}
      - PAYMENT_VNPAY_RETURNURL=${VNPAY_RETURN_URL:-http://localhost:4200/payments/vnpay-callback}
      - PAYMENT_MOCK_ENABLED=${PAYMENT_MOCK_ENABLED:-false}
    depends_on:
      pickleball-mysql:
        condition: service_healthy
      pickleball-redis:
        condition: service_started
volumes:
  pickleball_mysql_data:
