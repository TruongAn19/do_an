services:
  # ================================================================
  # NEW stack (sân bóng đá) — stack chính sau
  # ================================================================
  football-mysql:
    image: mysql:8.0
    container_name: football-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sanbongda
    ports:
      - "3308:3306"
    volumes:
      - football_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  football-redis:
    image: redis:alpine
    container_name: football-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  football-backend:
    build: .
    container_name: football-api
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=jdbc:mysql://football-mysql:3306/sanbongda?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_REDIS_HOST=football-redis
      - SPRING_REDIS_PORT=6379
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT=60000
      - AI_CHAT_ENABLED=${AI_CHAT_ENABLED:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-disabled-placeholder-key}
      - PAYMENT_VNPAY_URL=${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      - PAYMENT_VNPAY_TMNCODE=${VNPAY_TMN_CODE:-RF20BCUE}
      - PAYMENT_VNPAY_SECRETKEY=${VNPAY_HASH_SECRET:-8KBSIP2B3BHZH1AEBQ59AW4AU47EBAU8}
      - PAYMENT_VNPAY_RETURNURL=${VNPAY_RETURN_URL:-http://localhost:4200/payments/vnpay-callback}
      - PAYMENT_MOCK_ENABLED=false
    depends_on:
      football-mysql:
        condition: service_healthy
      football-redis:
        condition: service_healthy

volumes:
  football_mysql_data:
