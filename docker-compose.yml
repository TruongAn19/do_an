services:
  mysql:
    image: mysql:8.0
    container_name: badminton-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sancaulong1
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: badminton-redis
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: badminton-api
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sancaulong1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - PAYMENT_VNPAY_URL=${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      - PAYMENT_VNPAY_TMNCODE=${VNPAY_TMN_CODE:-RF20BCUE}
      - PAYMENT_VNPAY_SECRETKEY=${VNPAY_HASH_SECRET:-8KBSIP2B3BHZH1AEBQ59AW4AU47EBAU8}
      - PAYMENT_VNPAY_RETURNURL=${VNPAY_RETURN_URL:-http://localhost:4200/payments/vnpay-callback}
      - PAYMENT_MOCK_ENABLED=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data:
