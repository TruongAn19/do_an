services:
  # ================================================================
  # NEW stack (sân bóng đá) — stack chính sau
  # ================================================================
  football-mysql:
    image: mysql:8.0
    container_name: football-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sanbongda
    ports:
      - "3308:3306"
    volumes:
      - football_mysql_data:/var/lib/mysql

  football-redis:
    image: redis:alpine
    container_name: football-redis
    ports:
      - "6380:6379"

  football-backend:
    build: .
    container_name: football-api
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://football-mysql:3306/sanbongda?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_REDIS_HOST=football-redis
      - SPRING_REDIS_PORT=6379
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_AI_OPENAI_API_KEY=${OPENAI_API_KEY:-dummy_local_dev}
    depends_on:
      - football-mysql
      - football-redis

volumes:
  mysql_data:
  football_mysql_data:
