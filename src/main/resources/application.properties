spring.application.name=quanly
spring.jpa.hibernate.ddl-auto=update

#Flyway - Quản lý phiên bản database
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/sanbongda?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect



#default = 1MB
spring.servlet.multipart.max-file-size=50MB

#default = 10 MB (form data)
spring.servlet.multipart.max-request-size=50MB


#config vnpay
payment.vnPay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnPay.tmnCode=RF20BCUE
payment.vnPay.secretKey=8KBSIP2B3BHZH1AEBQ59AW4AU47EBAU8
payment.vnPay.returnUrl=http://localhost:4200/payments/vnpay-callback
payment.vnPay.version=2.1.0
payment.vnPay.command=pay
payment.vnPay.orderType=other
payment.vnPay.defaultBankCode=NCB

# Mock payment ? b?t khi ch?y local, t?t khi deploy
payment.mock.enabled=false


#config ntfy
ntfy.url=https://ntfy.sh

#email config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}

#JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

#CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

#Redis Configuration (football-redis: port 6380)
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6380}

server.port=8080
server.servlet.context-path=/

server.forward-headers-strategy=native

# Contact info — surfaced to users in refund/cancel response
app.contact.hotline=${CONTACT_HOTLINE:}
app.contact.email=${CONTACT_EMAIL:}

# AI Chat (disabled unless a valid OpenAI model is configured)
ai.chat.enabled=${AI_CHAT_ENABLED:false}
spring.ai.model.chat=${AI_CHAT_MODEL:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:disabled-while-ai-chat-is-off}

# Password reset links are generated only from this trusted backend setting.
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/reset-password}
