spring.application.name=quanly
spring.jpa.hibernate.ddl-auto=update

#Flyway - Quản lý phiên bản database
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
# --- LEGACY (cầu lông) — không dùng nữa ---
# spring.datasource.url=jdbc:mysql://localhost:3307/sancaulong1?createDatabaseIfNotExist=true
# --- NEW: football stack qua container football-db (port 3308) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/sanbongda?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect



#default = 1MB
spring.servlet.multipart.max-file-size=50MB

#default = 10 MB (form data)
spring.servlet.multipart.max-request-size=50MB


#config vnpay
payment.vnPay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnPay.tmnCode=${VNPAY_TMN_CODE:dummy_tmn}
payment.vnPay.secretKey=${VNPAY_SECRET_KEY:local_test_secret}
payment.vnPay.returnUrl=${VNPAY_RETURN_URL:http://localhost:4200/payments/vnpay-callback}
payment.vnPay.version=2.1.0
payment.vnPay.command=pay
payment.vnPay.orderType=other

# Mock payment — bật khi chạy local, tắt khi deploy
payment.mock.enabled=true


#config ntfy
ntfy.url=https://ntfy.sh

#email config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dummy@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

vapid.public.key=${VAPID_PUBLIC_KEY:dummy_public_key_for_vapid_12345678901234}
vapid.private.key=${VAPID_PRIVATE_KEY:dummy_private_key_for_vapid_1234}

#JWT Configuration
jwt.secret=${JWT_SECRET:dhis_is_a_very_long_secret_key_for_jwt_which_must_be_256_bits_at_least}
jwt.expiration=86400000

#OpenAI (đặt OPENAI_API_KEY trong env để dùng AI thật)
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy_openai_key_for_local_dev}

#CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

#Redis Configuration (football-redis: port 6380)
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6380}

server.port=8080
server.servlet.context-path=/

server.forward-headers-strategy=native

# Contact info — surfaced to users in refund/cancel response
app.contact.hotline=${CONTACT_HOTLINE:0123456789}
app.contact.email=${CONTACT_EMAIL:admin@badmintonhub.vn}
