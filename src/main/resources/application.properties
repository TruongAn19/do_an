spring.application.name=quanly
# Đọc biến cấu hình local từ file .env (file này đã được .gitignore).
spring.config.import=optional:file:.env[.properties]
spring.jpa.hibernate.ddl-auto=validate

#Flyway - Quản lý phiên bản database
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.datasource.url=jdbc:mysql://localhost:3307/sancaulong1?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect



#default = 1MB
spring.servlet.multipart.max-file-size=50MB

#default = 10 MB (form data)
spring.servlet.multipart.max-request-size=50MB


#config vnpay
payment.vnPay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnPay.tmnCode=RF20BCUE
payment.vnPay.secretKey=8KBSIP2B3BHZH1AEBQ59AW4AU47EBAU8
payment.vnPay.returnUrl=http://localhost:4200/payments/vnpay-callback
payment.vnPay.version=2.1.0
payment.vnPay.command=pay
payment.vnPay.orderType=other
payment.vnPay.defaultBankCode=NCB

# Mock payment — bật khi chạy local, tắt khi deploy
payment.mock.enabled=false


#config ntfy
ntfy.url=https://ntfy.sh

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG


#email config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dummy@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

vapid.public.key=${VAPID_PUBLIC_KEY:dummy_public_key_for_vapid_12345678901234}
vapid.private.key=${VAPID_PRIVATE_KEY:dummy_private_key_for_vapid_1234}

#JWT Configuration
jwt.secret=dev_jwt_secret_key_at_least_32_bytes_long_2026
jwt.expiration=86400000

#CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

#Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

server.port=8080
server.servlet.context-path=/

server.forward-headers-strategy=native

#Contact info hiển thị cho user khi cần liên hệ admin/staff (vd hoàn cọc thủ công)
app.contact.hotline=${CONTACT_HOTLINE:0123456789}
app.contact.email=${CONTACT_EMAIL:admin@badmintonhub.vn}

# AI Chat (Google GenAI SDK)
ai.chat.enabled=${AI_CHAT_ENABLED:false}
gemini.api-key=${GEMINI_API_KEY:disabled-placeholder-key}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}

# Giới hạn số lượng giữ chỗ active tối đa của mỗi người dùng cùng lúc
booking.hold.max-active-per-user=5

# Thời gian giữ chỗ sân tạm thời (phút)
booking.hold.duration-minutes=3

# Thời gian chờ thanh toán tối đa cho đơn thuê vợt PENDING (phút) — quá hạn job sẽ tự huỷ
rental.pending.expiry-minutes=30

# Membership level thresholds based on total value of fully-paid bookings.
membership.silver.min-spend=2000000
membership.gold.min-spend=5000000
