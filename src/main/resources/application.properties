spring.application.name=quanly
spring.config.import=optional:file:.env[.properties]
spring.jpa.hibernate.ddl-auto=validate

#Flyway - Quản lý phiên bản database
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.datasource.url=jdbc:mysql://localhost:3309/pickleball?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect



#default = 1MB
spring.servlet.multipart.max-file-size=5MB

#default = 10 MB (form data)
spring.servlet.multipart.max-request-size=6MB

# Uploads are stored outside the packaged application. Only validated JPEG/PNG files are accepted.
app.upload.directory=${UPLOAD_DIRECTORY:uploads/images}


#config vnpay
payment.vnPay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnPay.tmnCode=${VNPAY_TMN_CODE:}
payment.vnPay.secretKey=${VNPAY_HASH_SECRET:}
payment.vnPay.returnUrl=${VNPAY_RETURN_URL:http://localhost:4200/payments/vnpay-callback}
payment.vnPay.version=2.1.0
payment.vnPay.command=pay
payment.vnPay.orderType=other

# Mock payment — bật khi chạy local, tắt khi deploy
payment.mock.enabled=${PAYMENT_MOCK_ENABLED:false}


#config ntfy
ntfy.url=https://ntfy.sh

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG


#email config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dummy@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

vapid.public.key=${VAPID_PUBLIC_KEY:dummy_public_key_for_vapid_12345678901234}
vapid.private.key=${VAPID_PRIVATE_KEY:dummy_private_key_for_vapid_1234}

#JWT Configuration
jwt.secret=${JWT_SECRET:dhis_is_a_very_long_secret_key_for_jwt_which_must_be_256_bits_at_least}
jwt.expiration=86400000

#CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

#Contact info — hiển thị cho user khi cần hỏi về hoàn cọc
app.contact.hotline=${CONTACT_HOTLINE:0123456789}
app.contact.email=${CONTACT_EMAIL:admin@badmintonhub.vn}

# Optional one-time admin bootstrap. No account is created unless both are set.
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

#Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

server.port=8080
server.servlet.context-path=/

server.forward-headers-strategy=native

# Spring AI - OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-dummy-key-for-startup-replace-me}

# Gemini chatbot is optional. Controller and service are only created when enabled.
ai.chat.enabled=${AI_CHAT_ENABLED:false}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
