spring.application.name=quanly
spring.jpa.hibernate.ddl-auto=validate

#Flyway - Quản lý phiên bản database
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
# spring.datasource.url=jdbc:mysql://database-1.cbqwmi4e6bb9.ap-southeast-2.rds.amazonaws.com/sancaulong1?createDatabaseIfNotExist=true
# spring.datasource.username=admin
# spring.datasource.password=TruongAn1910
spring.datasource.url=jdbc:mysql://localhost:3307/sancaulong1?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect



#default = 1MB
spring.servlet.multipart.max-file-size=50MB

#default = 10 MB (form data)
spring.servlet.multipart.max-request-size=50MB


#config vnpay
payment.vnPay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnPay.tmnCode=${VNPAY_TMN_CODE:dummy_tmn}
payment.vnPay.secretKey=${VNPAY_SECRET_KEY:local_test_secret}
payment.vnPay.returnUrl=${VNPAY_RETURN_URL:http://localhost:4200/payments/vnpay-callback}
payment.vnPay.version=2.1.0
payment.vnPay.command=pay
payment.vnPay.orderType=other

# Mock payment — bật khi chạy local, tắt khi deploy
payment.mock.enabled=true


#config ntfy
ntfy.url=https://ntfy.sh

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG


#email config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dummy@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

vapid.public.key=${VAPID_PUBLIC_KEY:dummy_public_key_for_vapid_12345678901234}
vapid.private.key=${VAPID_PRIVATE_KEY:dummy_private_key_for_vapid_1234}

#JWT Configuration
jwt.secret=${JWT_SECRET:dhis_is_a_very_long_secret_key_for_jwt_which_must_be_256_bits_at_least}
jwt.expiration=86400000

#CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

#Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

server.port=8080
server.servlet.context-path=/

server.forward-headers-strategy=native

#Contact info hiển thị cho user khi cần liên hệ admin/staff (vd hoàn cọc thủ công)
app.contact.hotline=${CONTACT_HOTLINE:0123456789}
app.contact.email=${CONTACT_EMAIL:admin@badmintonhub.vn}

#AI Chat (Spring AI / OpenAI)
# Đặt AI_CHAT_ENABLED=true và OPENAI_API_KEY=<real key> trong env để bật tính năng.
# Khi disabled, AIChatService/AIChatController không được tạo; dummy key chỉ để Spring AI auto-config không crash lúc startup.
ai.chat.enabled=${AI_CHAT_ENABLED:false}
spring.ai.openai.api-key=${OPENAI_API_KEY:disabled-placeholder-key}
