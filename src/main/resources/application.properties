spring.application.name=quanly
spring.jpa.hibernate.ddl-auto=validate

#Flyway - Quản lý phiên bản database
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# spring.datasource.url=jdbc:mysql://database-1.cbqwmi4e6bb9.ap-southeast-2.rds.amazonaws.com/sancaulong1?createDatabaseIfNotExist=true
# spring.datasource.username=admin
# spring.datasource.password=TruongAn1910
spring.datasource.url=jdbc:mysql://localhost:3306/sancaulong1?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect



#default = 1MB
spring.servlet.multipart.max-file-size=50MB

#default = 10 MB (form data)
spring.servlet.multipart.max-request-size=50MB


#config vnpay
payment.vnPay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnPay.tmnCode=${VNPAY_TMN_CODE}
payment.vnPay.secretKey=${VNPAY_SECRET_KEY}
payment.vnPay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-callback}
payment.vnPay.version=2.1.0
payment.vnPay.command=pay
payment.vnPay.orderType=other


#config ntfy
ntfy.url=https://ntfy.sh

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG


#email config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}

#JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

#CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

#Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

server.port=8080
server.servlet.context-path=/

server.forward-headers-strategy=native
