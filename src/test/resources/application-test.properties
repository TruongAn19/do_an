# =============================================
# Test profile — chạy độc lập, không cần MySQL, Redis, hoặc bất kỳ service ngoài nào
# =============================================

# --- Database: H2 in-memory (MODE=MySQL để tương thích syntax) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE,USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- Flyway: tắt trong test (schema do Hibernate tạo qua ddl-auto) ---
spring.flyway.enabled=false

# --- Redis: tắt autoconfiguration để không cần Redis server ---
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# --- JWT (giá trị giả, đủ độ dài 256-bit) ---
jwt.secret=test_super_secret_key_that_is_at_least_256_bits_long_for_unit_testing
jwt.expiration=3600000

# --- VNPay (giá trị sandbox test) ---
payment.vnPay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnPay.tmnCode=TESTCODE
payment.vnPay.secretKey=TESTSECRETKEY12345678901234567890
payment.vnPay.returnUrl=http://localhost:8080/api/v1/payments/vnpay-callback
payment.vnPay.version=2.1.0
payment.vnPay.command=pay
payment.vnPay.orderType=other

# --- Mail: tắt kết nối thật (dùng host giả để JavaMailSender vẫn khởi tạo) ---
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- VAPID (giá trị dummy) ---
vapid.public.key=BHxs3GhF1h_FgU0pSVjuOVV1GlJC7M8q3gJk7EWPM96RfD3ZaJSBpfhBfV3Test
vapid.private.key=TestPrivateKeyForVapidPurposesOnlyNotRealKey

# --- CORS ---
cors.allowed-origins=http://localhost:3000

logging.level.com.example.quanly=INFO

# Giới hạn số lượng giữ chỗ active tối đa của mỗi người dùng cùng lúc
booking.hold.max-active-per-user=5

# Thời gian giữ chỗ sân tạm thời (phút)
booking.hold.duration-minutes=3

# Thời gian chờ thanh toán tối đa cho đơn thuê vợt PENDING (phút) — quá hạn job sẽ tự huỷ
rental.pending.expiry-minutes=30
